<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Кликер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 { font-size: 24px; margin-bottom: 10px; }
        .coin-counter { font-size: 48px; font-weight: bold; color: #ffaa00; margin: 20px 0; }
        .click-btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 20px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1 id="greeting">Привет, игрок!</h1>
    <p>Кликай по кнопке, чтобы зарабатывать монеты:</p>
    <div class="coin-counter" id="score">0</div>
    <button class="click-btn" id="clickButton">Клик! 🪙</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('greeting').innerText = `Привет, ${tg.initDataUnsafe.user.first_name}!`;
        }
        let score = parseInt(localStorage.getItem('game_score')) || 0;
        const scoreElement = document.getElementById('score');
        const clickButton = document.getElementById('clickButton');
        scoreElement.innerText = score;

        clickButton.addEventListener('click', () => {
            score += 1;
            scoreElement.innerText = score;
            localStorage.setItem('game_score', score);
            if (tg.HapticFeedback) { tg.HapticFeedback.impactOccurred('light'); }
        });
    </script>
</body>
</html>
